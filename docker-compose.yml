services:
  # ==============================================================================
  # Main training service - Based on official Unsloth image
  # ==============================================================================
  gemma3n-training:
    build:
      context: .
      dockerfile: Dockerfile
    image: gemma3n-unsloth:latest
    container_name: gemma3n-training
    
    # GPU configuration - Use all available GPUs
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all  # Use all GPUs, or specify 1, 2, etc.
              capabilities: [gpu]
    
    # Environment variables
    environment:
      # GPU settings
      - NVIDIA_VISIBLE_DEVICES=all
      - CUDA_VISIBLE_DEVICES=0  # Change to "0,1" for multi-GPU
      - PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True

      # Python settings
      - PYTHONUTF8=1
      - PYTHONUNBUFFERED=1

      # User settings (for sudo inside container if needed)
      - USER_PASSWORD=gemma3n2025

      # Optimization
      - OMP_NUM_THREADS=8
      - MKL_NUM_THREADS=8
      - TOKENIZERS_PARALLELISM=false
    
    # Volume mappings - mount your local files (Windows paths)
    volumes:
      # Mount entire project directory (includes prepared_dataset/)
      # Windows: Use forward slashes or double backslashes
      - .:/workspace/project

      # Mount external dataset (RT-DETRv2) - IMPORTANTE para acceso a imágenes
      # Las rutas en el dataset preparado apuntan a: /workspace/project/dataset/...
      # Este volumen hace que esas rutas sean accesibles en el contenedor
      - C:\Users\aleja\Desktop\RT-DETRv2-Densea\rtdetrv2_pytorch\dataset:/workspace/project/dataset:rw
    
    # Network configuration
    ports:
      - "6006:6006"  # TensorBoard
    
    # Shared memory for DataLoader workers (increase if needed)
    shm_size: '32gb'  # Adjust based on your batch size
    
    # IPC mode for better multi-process support
    ipc: host
    
    # Keep container running
    stdin_open: true
    tty: true
    
    # Working directory
    working_dir: /workspace/project
    
    # Run as unsloth user (non-root for security)
    user: unsloth
    
    # Default command - keep container alive
    command: /bin/bash
    
    # Restart policy
    restart: unless-stopped
    
    # Logging configuration
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ==============================================================================
  # TensorBoard service (optional, for monitoring)
  # ==============================================================================
  tensorboard:
    image: tensorflow/tensorflow:latest
    container_name: gemma3n-tensorboard
    
    volumes:
      - ./outputs:/workspace/outputs:ro
    
    ports:
      - "6007:6006"
    
    working_dir: /workspace
    
    command: tensorboard --logdir=/workspace/outputs --host=0.0.0.0 --port=6006 --reload_interval=30
    
    restart: unless-stopped
    profiles: ["monitoring"]  # Start with: docker-compose --profile monitoring up
    
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ==============================================================================
  # GPU Monitor service (optional, for system monitoring)
  # ==============================================================================
  gpu-monitor:
    build:
      context: .
      dockerfile: Dockerfile
    image: gemma3n-unsloth:latest
    container_name: gemma3n-gpu-monitor
    
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
    
    # Continuous GPU monitoring
    command: watch -n 2 nvidia-smi
    
    restart: unless-stopped
    profiles: ["monitoring"]
    
    stdin_open: true
    tty: true

# ==============================================================================
# Custom network (optional, for service isolation)
# ==============================================================================
networks:
  default:
    name: gemma3n-network
    driver: bridge