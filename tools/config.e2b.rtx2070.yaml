# ==============================================================================
# RTX 2070 - Configuración Conservadora Gemma 3n E2B para Detección Marina
# ==============================================================================
# Hardware Target:
#   - GPU: RTX 2070 (8GB VRAM, arquitectura Turing sm_75)
#   - RAM: 16-32GB DDR4 (variable según sistema)
#   - CPU: ~8 núcleos (Intel Core i7 / Ryzen 7 típico)
#   - Sistema: Windows 11 NATIVO (sin Docker)
#
# ADVERTENCIA CRÍTICA - LIMITACIONES DE VRAM:
#   - 8GB VRAM es el mínimo absoluto para fine-tuning VLM con QLoRA
#   - Cada decisión en esta config prioriza NO quedarse sin memoria
#   - Si obtienes OOM (Out of Memory): reducir batch a 1 y seq a 1024
#   - Monitorizar VRAM con: nvidia-smi -l 1 (actualiza cada segundo)
#
# Por qué E2B y no E4B en RTX 2070:
#   - E4B cuantizado a 4-bit ocupa ~4GB de VRAM solo el modelo base
#   - E2B cuantizado a 4-bit ocupa ~2GB, dejando 6GB para activaciones
#   - Con batch=2 y seq=2048, las activaciones de E2B caben en 5-6GB
#   - E4B + batch=2 + seq=2048 causaría OOM en 8GB con margen mínimo
#   - E2B es el único modelo Gemma 3n viable en 8GB VRAM para VLM training
#
# Antecedente - Overfitting en run E4B (RTX 5090):
#   - train_loss=0.163 vs eval_loss=2.556 (gap de 15x)
#   - Esta config incorpora lora_dropout=0.05 y weight_decay=0.02
#   - LR más conservador (2e-5 vs 2e-4 del run problemático)
#   - Early stopping más agresivo (patience=3 vs 5)
#
# Expectativas de Rendimiento:
#   - Velocidad: ~0.08-0.12 pasos/segundo en RTX 2070
#   - Tiempo total estimado: 15-20 horas de entrenamiento
#   - Pico de uso VRAM: ~7-7.8GB (límite de 8GB)
#   - Batch efectivo: 2 * 8 = 16 muestras por optimización
#
# Dataset:
#   - Train:      10,247 muestras
#   - Validación:  2,205 muestras
#   - Test:        2,185 muestras
#   - Rutas:       Windows locales (./prepared_dataset/, sin Docker)
# ==============================================================================

training:
  run_name: "gemma3n_e2b_rtx2070_mobile_v1"

  # Ruta de salida LOCAL (Windows nativo, sin Docker)
  # Relativa al directorio donde se ejecuta train.py
  # Equivale a: C:\Users\aleja\Desktop\gemma3n\outputs\gemma3n\
  output_root: "./outputs/gemma3n"

  # Modelo base: Gemma 3n E2B instruct (única opción viable con 8GB VRAM)
  model_name: "unsloth/gemma-3n-E2B-it"

  # ==============================================================================
  # Longitud de Secuencia - REDUCIDA POR LIMITACIÓN DE VRAM
  # ==============================================================================

  # max_seq_len: 2048 (REDUCIDO vs 4096 del config RTX 5090)
  # Justificación crítica para 8GB VRAM:
  #   - La memoria de atención crece cuadráticamente con la longitud: O(n²)
  #   - seq=4096 requiere ~4x más memoria de atención que seq=2048
  #   - Con 8GB VRAM, seq=4096 + batch=2 causaría OOM garantizado
  #   - seq=2048 es suficiente para el formato de salida del detector:
  #       * Tokens de imagen: ~256-512 tokens
  #       * Prompt del sistema: ~200 tokens
  #       * JSON de detección (bboxes + clases): ~300-600 tokens
  #   - Total típico: ~800-1300 tokens, seq=2048 no trunca ninguna muestra
  max_seq_len: 2048

  # ==============================================================================
  # Precisión y Configuración de Memoria
  # ==============================================================================

  # QLoRA 4-bit: OBLIGATORIO en 8GB VRAM
  # Sin cuantización 4-bit, el modelo E2B no cabría en memoria
  # NF4 (Normal Float 4) de bitsandbytes minimiza la pérdida de precisión
  use_4bit: true

  # BFloat16 para adaptadores LoRA y cómputo
  # RTX 2070 (Turing) tiene soporte hardware BF16 limitado vs Ampere/Blackwell
  # Sin embargo, bitsandbytes gestiona la conversión automáticamente
  # BF16 es más estable que FP16 para entrenamiento largo (15-20h)
  bf16: true
  fp16: false  # Nunca combinar fp16=true y bf16=true

  # CRÍTICO: gradient_checkpointing="unsloth" ES ESENCIAL EN 8GB VRAM
  # Sin gradient checkpointing: las activaciones de todos los layers
  # se guardan en VRAM durante el forward pass -> OOM inmediato con E2B
  # Con gradient_checkpointing="unsloth":
  #   - Solo se guardan activaciones en puntos de checkpoint seleccionados
  #   - El resto se recomputa en el backward pass (más lento, menos VRAM)
  #   - Ahorro de VRAM: ~40-50% de las activaciones del modelo
  #   - Unsloth implementa checkpointing inteligente (más eficiente que PyTorch)
  # NOTA: "unsloth" es mejor que True (implementación estándar de HuggingFace)
  gradient_checkpointing: "unsloth"

  # ==============================================================================
  # Duración del Entrenamiento y Optimización
  # ==============================================================================

  # Épocas: 50 (el early stopping se activará mucho antes en la práctica)
  # Con 10,247 muestras y batch_efectivo=16:
  #   - Pasos por época ≈ 10,247 / 16 ≈ 640 pasos/época
  #   - 50 épocas ≈ 32,000 pasos máximos (jamás se alcanzarán con early stop)
  #   - Early stopping (patience=3) detiene tras ~1,800 pasos sin mejora
  #   - Estimación realista: 10-15 épocas efectivas ≈ 6,400-9,600 pasos
  epochs: 50

  # Optimizador: Paged AdamW 8-bit
  # "Paged" es ESPECIALMENTE importante en 8GB VRAM:
  #   - Los estados del optimizador (momentos m1, m2) se paginan a RAM CPU
  #   - Cuando no caben en VRAM, se transfieren automáticamente
  #   - Sin "paged": los momentos de Adam para LoRA r=32 consumen ~300MB VRAM
  #   - Con "paged": esos 300MB se mueven a RAM cuando hay presión de memoria
  optim: "paged_adamw_8bit"

  # Weight decay: 0.02 (regularización L2 moderada)
  # Ayuda a combatir el overfitting observado en el run E4B anterior
  # No afecta bias ni layer norms (gestionado por HuggingFace Trainer)
  weight_decay: 0.02

  # Gradient clipping: norma L2 máxima del gradiente global
  # Previene explosión de gradientes, especialmente crítico en los primeros
  # pasos del warmup donde los pesos LoRA aún no están calibrados
  max_grad_norm: 1.0

  # ==============================================================================
  # Configuración de Learning Rate - CONSERVADOR PARA 8GB VRAM
  # ==============================================================================

  # Learning Rate: 2e-5 (CONSERVADOR)
  # Por qué más bajo que el config RTX 5090 (5e-5):
  #   - RTX 2070 no tiene RSLoRA (use_rslora=false, r=32)
  #   - Con LoRA estándar a r=32, alpha/rank = 2.0 (más agresivo que RSLoRA)
  #   - LR alto + LoRA estándar = gradientes más grandes = mayor riesgo de overfitting
  #   - 2e-5 garantiza convergencia estable aunque sea más lenta
  #   - El entrenamiento largo (15-20h) compensa la velocidad de convergencia menor
  # Comparación de runs:
  #   - Run E4B con 2e-4: overfitting severo (eval_loss 15x mayor que train_loss)
  #   - Esta config con 2e-5: 10x más conservador, prioriza generalización
  lr: 2.0e-5

  # Warmup: 3% de los pasos totales
  # Menos warmup que RTX 5090 (5%) porque el LR es más conservador
  # El LR bajo hace que el warmup sea menos crítico para la estabilidad
  # En la práctica: ~200-300 pasos de warmup lineal
  warmup_ratio: 0.03

  # Scheduler coseno: decae el LR suavemente hacia 0
  # Adecuado para entrenamiento largo con early stopping
  lr_scheduler_type: "cosine"

  # ==============================================================================
  # Configuración de Batch - MÍNIMO VIABLE PARA 8GB VRAM
  # ==============================================================================

  # Batch size por dispositivo: 2
  # Por qué 2 (y no 4 o más):
  #   - Con E2B cuantizado (4-bit) + seq=2048: cada muestra ocupa ~2.5GB VRAM
  #   - VRAM disponible para activaciones: 8GB - 2GB (modelo) - 0.5GB (sistema) = 5.5GB
  #   - batch=2: 2 * 2.5GB = 5GB de activaciones -> justo al límite (seguro con checkpointing)
  #   - batch=4: 4 * 2.5GB = 10GB -> OOM garantizado
  #   - batch=1 es posible pero desperdicia GPU (muy baja utilización, más lento)
  #   - batch=2 es el mínimo viable que mantiene GPU utilization razonable (~60-70%)
  # NOTA: Si obtienes OOM con batch=2, reducir max_seq_len a 1024 primero
  per_device_train_batch_size: 2

  # Batch de evaluación: 1 (sin backward pass pero la VRAM sigue siendo limitada)
  # Durante eval, sin gradient checkpointing, todas las activaciones están en memoria
  # Con batch=1 la evaluación es segura; batch=2 puede causar OOM en eval
  per_device_eval_batch_size: 1

  # Acumulación de gradientes: 8 pasos
  # COMPENSA el batch pequeño para simular un batch efectivo mayor:
  #   - Batch efectivo = 2 (por GPU) * 8 (acumulación) = 16 muestras/optimización
  #   - 16 es el mínimo recomendado para gradientes estables en VLMs
  #   - Sin acumulación (batch_efectivo=2): gradientes muy ruidosos, entrenamiento inestable
  #   - Con 8 pasos de acumulación: los gradientes de 16 muestras se promedian
  # Trade-off: más acumulación = actualización más estable pero más lenta
  # 8 pasos es el balance óptimo para RTX 2070 con este dataset
  gradient_accumulation_steps: 8

  # Workers del DataLoader: 4
  # Por qué 4 (y no 16 como RTX 5090):
  #   - ~8 núcleos disponibles en CPU de laptop/desktop mid-range
  #   - 4 workers es suficiente para no hacer bottleneck con batch=2
  #   - Más workers = más RAM usada y más overhead de proceso
  #   - En Windows nativo, más de 4 workers puede causar problemas de spawn
  dataloader_num_workers: 4

  # ==============================================================================
  # Procesamiento del Dataset - CONFIGURACIÓN CRÍTICA PARA WINDOWS
  # ==============================================================================

  # OBLIGATORIO EN WINDOWS NATIVO: dataset_num_proc=1
  # Por qué 1 y NO más (a diferencia del config de Docker/Linux):
  #   - Windows usa "spawn" para multiprocessing (no "fork" como Linux)
  #   - HuggingFace Datasets con num_proc>1 en Windows lanza subprocesos
  #   - Estos subprocesos no heredan el entorno correctamente en Windows
  #   - Resultado: errores de pickle, deadlocks, o crashes silenciosos
  #   - Con num_proc=1, el procesamiento es secuencial pero 100% estable
  #   - El preprocesamiento del dataset (tokenización) ocurre una sola vez
  #   - Aunque más lento (5-10 min vs 1-2 min), no afecta el entrenamiento
  # NOTA: Si usas este config en Docker/Linux, puedes subir a 4
  dataset_num_proc: 1

  # Tamaño de batch para operaciones .map(): 500
  # Reducido (vs 2000 en RTX 5090) por la RAM limitada del sistema
  # 500 muestras en memoria simultánea = ~500MB RAM (seguro con 16-32GB)
  dataset_batch_size: 500

  # ==============================================================================
  # Logging, Evaluación y Checkpointing
  # ==============================================================================

  # Log cada 10 pasos (frecuente, útil para monitorizar en entrenamiento largo)
  logging_steps: 10
  logging_first_step: false

  # Evaluación cada 600 pasos
  # Por qué 600 (MUCHO menos frecuente que los 150 del config RTX 5090):
  #   - La evaluación en RTX 2070 es lenta: batch=1, sin optimizaciones avanzadas
  #   - 2,205 muestras de validación / 1 (eval_batch) = 2,205 pasos de eval
  #   - Cada evaluación completa toma ~20-30 minutos en RTX 2070
  #   - Con eval_steps=600: se evalúa cada ~1 época (640 pasos/época ≈ 600)
  #   - Con eval_steps=150: la evaluación dominaría el tiempo total de ejecución
  #   - 600 pasos es el balance entre detección de overfitting y velocidad
  evaluation_strategy: "steps"
  eval_steps: 600

  # Checkpoint cada 600 pasos (sincronizado con eval_steps)
  save_strategy: "steps"
  save_steps: 600

  # Solo 3 checkpoints (espacio en disco de laptop es limitado)
  # Cada checkpoint E2B ocupa ~4-5GB en disco
  # 3 checkpoints = ~12-15GB máximo de almacenamiento
  save_total_limit: 3

  # Selección del mejor modelo por eval_loss
  metric_for_best_model: "eval_loss"
  load_best_model_at_end: true  # Carga el mejor checkpoint al finalizar

  # ==============================================================================
  # Early Stopping - MÁS AGRESIVO QUE RTX 5090
  # ==============================================================================

  early_stopping:
    enabled: true

    # Patience: 3 evaluaciones sin mejora = detener entrenamiento
    # Por qué 3 (más agresivo que las 5 del config RTX 5090):
    #   - El entrenamiento ya es lento (15-20h), no queremos desperdiciar tiempo
    #   - 3 * 600 pasos = 1,800 pasos de gracia ≈ 2-3 épocas
    #   - Si en 2-3 épocas no mejora la eval_loss, el modelo ya convergió
    #   - Ahorra potencialmente 8-12 horas de entrenamiento inútil
    patience: 3

    # Umbral de mejora: 0.0 (cualquier mejora, por pequeña que sea, resetea el contador)
    # Más permisivo que el 0.001 del RTX 5090 porque:
    #   - Con batch_efectivo=16, los gradientes son más ruidosos
    #   - Mejoras pequeñas (<0.001) pueden ser reales, no solo ruido
    #   - threshold=0.0 evita detener prematuramente con batch pequeño
    threshold: 0.0

  # ==============================================================================
  # Reanudación de Entrenamiento
  # ==============================================================================

  # En Windows, los entrenamientos largos (15-20h) pueden interrumpirse
  # Cambiar a true y especificar la ruta del checkpoint para reanudar
  # Ejemplo: resume_checkpoint_path: "./outputs/gemma3n/runs/gemma3n_e2b_rtx2070_mobile_v1/checkpoint-1200"
  resume_from_checkpoint: false
  resume_checkpoint_path: null  # null = detecta el último checkpoint automáticamente

  # ==============================================================================
  # Reproducibilidad y Monitorización
  # ==============================================================================

  # Semilla aleatoria (misma que otros configs del proyecto para comparabilidad)
  seed: 21

  # Sin TensorBoard ni WandB en laptop
  # Por qué report_to="none":
  #   - TensorBoard consume recursos adicionales de CPU y disco I/O
  #   - En RTX 2070 con 8GB VRAM, cada recurso cuenta
  #   - WandB requiere internet y registro de cuenta
  #   - El logging a consola (logging.console=true) es suficiente para monitorizar
  #   - Si quieres TensorBoard igual: cambia a "tensorboard" y ejecuta:
  #     tensorboard --logdir ./outputs/gemma3n/runs/gemma3n_e2b_rtx2070_mobile_v1
  report_to: "none"

# ==============================================================================
# Configuración de Datos - RUTAS LOCALES WINDOWS
# ==============================================================================
data:
  # Rutas LOCALES de Windows (no rutas Docker /workspace/...)
  # Relativas al directorio de ejecución del script train.py
  # Para ejecutar: cd C:\Users\aleja\Desktop\gemma3n && python tools\train.py --config tools\config.e2b.rtx2070.yaml
  # El dataset debe estar en: C:\Users\aleja\Desktop\gemma3n\prepared_dataset\
  train_jsonl: "./prepared_dataset/train_dataset.jsonl"
  eval_jsonl: "./prepared_dataset/validation_dataset.jsonl"

# ==============================================================================
# Configuración PEFT (LoRA) - OPTIMIZADA PARA 8GB VRAM
# ==============================================================================
peft:
  # LoRA Rank: 32
  # Por qué r=32 (menor que r=64 del config RTX 5090):
  #   - Cada unidad de rank ocupa memoria adicional en VRAM
  #   - r=64 requiere ~400MB VRAM extra vs r=32 (~200MB extra)
  #   - En 8GB VRAM, esos 200MB pueden ser la diferencia entre funcionar y OOM
  #   - r=32 sigue siendo suficiente para adaptar E2B a detección marina:
  #       * El dataset tiene 10,247 muestras (no trivial, no masivo)
  #       * La tarea es especializada pero no requiere rank máximo
  #       * r=32 con todos los módulos activos captura las adaptaciones necesarias
  # NOTA: Si tienes OOM incluso con r=32, reducir a r=16 como último recurso
  r: 32

  # LoRA Alpha: 64 (ratio alpha/rank = 2.0)
  # Con LoRA estándar (sin RSLoRA): escala = alpha/rank = 64/32 = 2.0
  # Esto da un factor de escala moderado para las actualizaciones LoRA
  # Si se activara RSLoRA: escala = 64/sqrt(32) ≈ 11.3 (demasiado agresivo)
  lora_alpha: 64

  # LoRA Dropout: 0.05 (regularización contra overfitting)
  # Igual que el config RTX 5090 - mantenemos dropout para combatir el
  # overfitting observado en el run E4B anterior (gap train/eval de 15x)
  # El 5% de dropout es conservador: no degrada convergencia significativamente
  lora_dropout: 0.05

  # RSLoRA: DESACTIVADO (a diferencia del config RTX 5090)
  # Por qué use_rslora=false para r=32:
  #   - RSLoRA aporta beneficios de estabilidad principalmente para r>=64
  #   - Para r=32, LoRA estándar ya es suficientemente estable
  #   - RSLoRA añade cómputo adicional sin beneficio neto a rank bajo
  #   - La normalización por sqrt(rank) no es necesaria cuando rank es pequeño
  #   - Ahorro marginal de cómputo (importante cuando cada ms cuenta en RTX 2070)
  use_rslora: false

  # Fine-tuning de todos los módulos principales
  # Igual que RTX 5090: necesitamos adaptar todos los componentes para
  # aprender las características visuales de residuos marinos
  tune_vision_layers: true      # Encoder visual: detecta plásticos, redes, etc.
  tune_language_layers: true    # Decoder: genera JSON con categorías y coordenadas
  tune_attention_modules: true  # Atención: localización espacial de objetos
  tune_mlp_modules: true        # FFN: clasificación de tipos de residuo

# ==============================================================================
# Configuración del Sistema
# ==============================================================================
system:
  # Deshabilitar Weights & Biases (evita peticiones de autenticación en terminal)
  disable_wandb: true

logging:
  # Logging en consola habilitado
  # La consola es el único canal de monitorización activo (report_to="none")
  # Seguimiento recomendado: ver train_loss vs eval_loss en los logs
  console: true

# ==============================================================================
# Configuración de Exportación (Post-Entrenamiento)
# ==============================================================================
export:
  # Fusionar adaptadores LoRA con modelo base tras el entrenamiento
  # El modelo fusionado (~4GB en BF16) se puede convertir después a:
  #   - ONNX -> TFLite/LiteRT para Android (OceanGuard app)
  #   - GGUF para inferencia local con Llama.cpp
  merge_and_save: true
  merged_output_dir: null  # null = auto: ./outputs/gemma3n/runs/{run_name}/merged_model
  merge_dtype: "bf16"      # Mantener BF16 para máxima calidad en el merge

  # GGUF deshabilitado por defecto
  # Para exportar a GGUF después del merge, ejecutar manualmente:
  #   python tools/export_gguf.py --source ./outputs/.../merged_model --quant Q4_K_M
  export_gguf: false
  gguf_output_dir: null
  gguf_quant: "Q4_K_M"   # 4-bit K-means (si se habilita)
  gguf_source_dir: null

# ==============================================================================
# Optimizaciones Extra
# ==============================================================================
extras:
  # Collator de datos visual de Unsloth (manejo multimodal imagen+texto)
  # REQUERIDO: el dataset mezcla imágenes de distintas resoluciones
  use_vision_data_collator: true

  # Flash Attention 2 en RTX 2070 (Turing sm_75)
  # NOTA: FA2 tiene soporte limitado en Turing (sm_75):
  #   - FA2 oficial requiere sm_80+ (Ampere o superior) para soporte completo
  #   - Unsloth puede tener fallback a FA1 o eager en sm_75
  #   - Si el entrenamiento falla con FA2: cambiar a "eager" o "sdpa"
  #   - "sdpa" (Scaled Dot Product Attention de PyTorch 2.0+) es la alternativa
  #     recomendada para Turing: más rápido que eager, sin requisito sm_80+
  # Cambio si hay error: attn_implementation: "sdpa"
  attn_implementation: "flash_attention_2"

  # torch.compile: deshabilitado (igual que todos los configs QLoRA)
  # Incompatible con bitsandbytes 4-bit y con Unsloth custom kernels
  # En RTX 2070 además no habría beneficio: Turing tiene compilación JIT limitada
  torch_compile: false
  torch_compile_mode: "reduce-overhead"  # Ignorado (torch_compile=false)

# ==============================================================================
# Benchmarks de Rendimiento Esperados (RTX 2070 + E2B)
# ==============================================================================
# Velocidad de Entrenamiento:
#   - Pasos/segundo: ~0.08-0.12 (vs 1.0-1.3 del RTX 5090)
#   - Tiempo estimado por época: ~1.5-2h (640 pasos * ~10s/paso)
#   - Tiempo total estimado: 15-20 horas con early stopping
#   - Pico de uso VRAM: ~7-7.8GB (muy cercano al límite de 8GB)
#   - Utilización GPU: 70-85% (limitado por I/O y CPU bottleneck)
#
# Calidad del Modelo:
#   - Eval loss esperado: <1.0 con early stopping correctamente configurado
#   - Gap train/eval: <3x (overfitting controlado por dropout + LR bajo)
#   - Tiempo de inferencia en móvil (E2B): ~200-400ms por imagen
#
# Utilización de Recursos (Windows nativo):
#   - GPU: RTX 2070 @ 70-85%
#   - CPU: ~25-40% de los 8 núcleos (4 workers DataLoader)
#   - RAM: ~4-8GB de la RAM disponible (dataset en memoria parcialmente)
#   - Disco: I/O moderado durante carga de muestras JSONL
# ==============================================================================

# ==============================================================================
# Instrucciones de Uso (Windows Nativo, sin Docker)
# ==============================================================================
# 1. Crear y activar entorno virtual (si no está creado):
#      python -m venv venv
#      venv\Scripts\activate
#
# 2. Instalar dependencias (una sola vez):
#      pip install -r requirements-mobile.txt
#    o bien:
#      pip install unsloth bitsandbytes transformers trl peft datasets
#
# 3. Preparar dataset (si no está hecho):
#      python tools\prepare_dataset.py
#    Verificar que existen:
#      .\prepared_dataset\train_dataset.jsonl
#      .\prepared_dataset\validation_dataset.jsonl
#
# 4. Verificar GPU (debe mostrar True y la GPU correcta):
#      python -c "import torch; print(torch.cuda.is_available()); print(torch.cuda.get_device_name(0))"
#
# 5. Iniciar entrenamiento (desde el directorio del proyecto):
#      cd C:\Users\aleja\Desktop\gemma3n
#      python tools\train.py --config tools\config.e2b.rtx2070.yaml
#
# 6. Monitorizar VRAM en otra terminal (actualiza cada 2 segundos):
#      nvidia-smi -l 2
#    Vigilar: la columna "MiB" no debe superar 7800/8192 MiB
#
# 7. Si hay OOM, intentar en este orden:
#      a) Reducir max_seq_len: 2048 -> 1024
#      b) Cambiar attn_implementation: "flash_attention_2" -> "sdpa"
#      c) Reducir per_device_train_batch_size: 2 -> 1
#      d) Reducir peft.r: 32 -> 16
#
# 8. Evaluar modelo resultante:
#      python tools\evaluate_models.py \
#        --model-path .\outputs\gemma3n\runs\gemma3n_e2b_rtx2070_mobile_v1
# ==============================================================================
