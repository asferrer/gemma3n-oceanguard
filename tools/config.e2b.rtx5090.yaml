# ==============================================================================
# RTX 5090 - Configuración Gemma 3n E2B para Detección de Residuos Marinos
# ==============================================================================
# Hardware Target:
#   - GPU: RTX 5090 (32GB GDDR7, arquitectura Blackwell sm_120)
#   - RAM: 96GB DDR5
#   - CPU: Intel Core Ultra 9 285K (24 núcleos)
#   - Sistema: Windows 11 + Docker (container Linux)
#
# Por qué E2B en lugar de E4B:
#   - E2B (~2B parámetros activos) ocupa ~2GB RAM en dispositivo móvil
#   - E4B (~4B parámetros activos) ocupa ~3GB RAM en dispositivo móvil
#   - Los dispositivos Android mid-range tienen 4-6GB RAM total
#   - E2B deja margen operativo para el SO y otras apps
#   - Latencia de inferencia ~40% menor en CPU móvil (sin NPU)
#   - Objetivo final: despliegue en OceanGuard Android app (MediaPipe / LiteRT)
#
# Antecedente - Problema de Overfitting en E4B:
#   - Entrenamiento E4B anterior: train_loss=0.163 vs eval_loss=2.556
#   - Gap de 15x indica overfitting severo
#   - Esta configuración introduce correcciones: dropout, r=64+RSLoRA,
#     lr más conservador, más épocas con early stopping
#
# Expectativas de Rendimiento:
#   - Velocidad: ~1.0-1.3 pasos/segundo (E2B es más rápido que E4B)
#   - Tiempo total de entrenamiento: 3-5 horas en RTX 5090
#   - Uso pico de VRAM: ~24-27GB (margen de seguridad con 32GB)
#   - Batch efectivo: 16 * 4 = 64 muestras por paso de optimización
#   - Eval loss esperado: <1.0 con early stopping correctamente calibrado
#
# Dataset:
#   - Train:      10,247 muestras (imagen JSONL multimodal)
#   - Validación:  2,205 muestras
#   - Test:        2,185 muestras
# ==============================================================================

training:
  run_name: "gemma3n_e2b_rtx5090_mobile_v1"
  output_root: "/workspace/project/outputs/gemma3n"

  # Modelo base: Gemma 3n E2B instruct
  # E2B = "Efficient 2B" - versión compacta optimizada para edge/mobile
  # Checkpoint oficial de Unsloth con optimizaciones de cuantización pre-aplicadas
  model_name: "unsloth/gemma-3n-E2B-it"

  # ==============================================================================
  # Longitud de Secuencia
  # ==============================================================================

  # max_seq_len: 4096 (AUMENTADO vs config E4B que usaba 2048)
  # Justificación:
  #   - E2B ocupa significativamente menos VRAM que E4B por bloque de atención
  #   - Con 32GB GDDR7 y batch=16 hay margen suficiente para secuencias largas
  #   - Las secuencias de detección de residuos incluyen:
  #       * Tokens de imagen (variable según resolución)
  #       * Prompt del sistema (~200 tokens)
  #       * JSON de salida con bounding boxes + clases (~300-600 tokens)
  #   - 4096 garantiza que ninguna muestra del dataset sea truncada
  max_seq_len: 4096

  # ==============================================================================
  # Precisión y Configuración de Memoria
  # ==============================================================================

  # QLoRA con cuantización 4-bit (NF4)
  # Reduce el modelo base de ~8GB a ~2GB en VRAM
  # Permite entrenar E2B con batch grande en RTX 5090
  use_4bit: true

  # BFloat16 para los adaptadores LoRA y activaciones
  # Superior a FP16 en Blackwell: mejor rango numérico, sin overflow
  # Recomendado por Unsloth para RTX 4090+ y arquitecturas recientes
  bf16: true
  fp16: false  # NUNCA usar fp16 y bf16 simultáneamente

  # Gradient checkpointing con implementación optimizada de Unsloth
  # Ahorra ~30% de VRAM adicional vs gradient_checkpointing: true estándar
  # Unsloth recomputa activaciones de forma selectiva e inteligente
  # IMPRESCINDIBLE incluso en RTX 5090 para poder usar batch=16 + seq=4096
  gradient_checkpointing: "unsloth"

  # ==============================================================================
  # Duración del Entrenamiento y Optimización
  # ==============================================================================

  # Épocas: 50 (con early stopping activo)
  # El early stopping (patience=5, 750 pasos) detendrá antes si la eval_loss
  # converge. 50 épocas es el techo de seguridad, no el tiempo esperado.
  # Con 10,247 muestras y batch_efectivo=64:
  #   - Pasos por época ≈ 10,247 / 64 ≈ 160 pasos/época
  #   - 50 épocas ≈ 8,000 pasos máximos
  epochs: 50

  # Optimizador: Paged AdamW 8-bit (bitsandbytes)
  # "Paged" = usa memoria unificada CPU-GPU para los estados del optimizador
  # Evita OOM cuando los momentos de Adam no caben en VRAM
  # 8-bit = comprime estados de optimizador (reduce ~4x vs FP32 Adam)
  optim: "paged_adamw_8bit"

  # Regularización L2 aplicada a los pesos de los adaptadores LoRA
  # 0.02 (moderado) ayuda a combatir el overfitting observado en el run E4B
  # No aplicar a bias ni a layer norms (HuggingFace lo gestiona automáticamente)
  weight_decay: 0.02

  # Gradient clipping: limita la norma L2 del gradiente global a 1.0
  # Previene explosión de gradientes en los primeros pasos del warmup
  max_grad_norm: 1.0

  # ==============================================================================
  # Configuración de Learning Rate
  # ==============================================================================

  # Learning Rate: 5e-5
  # RAZONAMIENTO - punto intermedio deliberado:
  #   - 2e-5: LR base conservador (configuración RTX 2070 de este proyecto)
  #   - 2e-4: LR agresivo del run E4B anterior (contribuyó al overfitting)
  #   - 5e-5: balance entre velocidad de convergencia y estabilidad
  # Con RSLoRA activo (use_rslora=true), la escala efectiva se normaliza
  # por sqrt(r), lo que equivale a ~6.25e-6 de actualización efectiva por
  # dimensión de rango. Conservador pero suficiente para el dataset de 10k.
  lr: 5.0e-5

  # Warmup: 5% de los pasos totales
  # ≈ 400 pasos de warmup lineal antes de activar el scheduler coseno
  # 5% es más robusto que 3% para modelos multimodales con vision encoder
  warmup_ratio: 0.05

  # Scheduler coseno: decae suavemente el LR desde 5e-5 hasta ~0
  # Mejor generalización que linear decay en las últimas épocas
  lr_scheduler_type: "cosine"

  # ==============================================================================
  # Configuración de Batch - OPTIMIZADO PARA RTX 5090 CON E2B
  # ==============================================================================

  # Batch size por dispositivo: 16
  # Por qué 16 (MAYOR que el E4B config que usaba 12):
  #   - E2B tiene ~50% menos parámetros activos que E4B
  #   - Cada muestra en forward pass ocupa menos memoria de activaciones
  #   - Con max_seq_len=4096 y E2B, el pico de VRAM por muestra es ~1.5GB
  #   - 16 * 1.5GB ≈ 24GB, dentro del límite de 32GB con margen
  #   - El modelo base cuantizado ocupa ~2GB fijos
  #   - Los adaptadores LoRA r=64 añaden ~400MB adicionales
  # Batch grande = gradientes más estables = menos riesgo de overfitting
  per_device_train_batch_size: 16

  # Batch de evaluación: 8 (sin backward pass, menos memoria requerida)
  per_device_eval_batch_size: 8

  # Acumulación de gradientes: 4 pasos
  # Batch efectivo = 16 (por GPU) * 4 (acumulación) = 64 muestras/optimización
  # 64 es grande: reduce varianza del gradiente y mejora la estabilidad
  # El paper de Gemma 3n recomienda batch efectivo >=32 para multimodal
  gradient_accumulation_steps: 4

  # Workers del DataLoader: 16 (aprovecha los 24 núcleos del Core Ultra 9)
  # Previene bottleneck de CPU durante carga de imágenes del dataset JSONL
  # Linux (Docker) permite multiprocessing real en DataLoader (Windows no)
  dataloader_num_workers: 16

  # ==============================================================================
  # Procesamiento del Dataset - OPTIMIZADO PARA CPU
  # ==============================================================================

  # Hilos para preprocesamiento paralelo del dataset (tokenización, etc.)
  # 8 hilos: balance entre velocidad y overhead de proceso
  # Posible en Linux/Docker, a diferencia de Windows nativo
  dataset_num_proc: 8

  # Tamaño de batch para operaciones .map() de HuggingFace Datasets
  # 2000 aprovecha los 96GB de RAM disponibles para caching eficiente
  dataset_batch_size: 2000

  # ==============================================================================
  # Logging, Evaluación y Checkpointing
  # ==============================================================================

  # Log cada 10 pasos de entrenamiento en TensorBoard + consola
  logging_steps: 10
  logging_first_step: false  # Evita log espurio en paso 0

  # Evaluación cada 150 pasos
  # Con ~160 pasos/época, esto equivale a evaluar casi cada época
  # Permite detectar overfitting tempranamente (el gap E4B se vería en ~200 pasos)
  evaluation_strategy: "steps"
  eval_steps: 150

  # Checkpoint cada 150 pasos (sincronizado con eval_steps)
  # Garantiza que siempre existe un checkpoint del mejor modelo evaluado
  save_strategy: "steps"
  save_steps: 150

  # Mantener los 5 mejores checkpoints (suficiente storage en server)
  # Los checkpoints E2B son más ligeros que E4B (~60% del tamaño)
  save_total_limit: 5

  # Métrica de selección del mejor modelo: eval_loss
  # Alternativa futura: "detection_f1" si se implementan métricas custom
  metric_for_best_model: "eval_loss"

  # Carga automáticamente el mejor checkpoint al final del entrenamiento
  # IMPORTANTE: requiere que save_strategy == evaluation_strategy
  load_best_model_at_end: true

  # ==============================================================================
  # Early Stopping - DEFENSA PRINCIPAL CONTRA OVERFITTING
  # ==============================================================================

  early_stopping:
    enabled: true

    # Patience: 5 evaluaciones consecutivas sin mejora = detener
    # 5 * 150 pasos = 750 pasos de gracia ≈ 4-5 épocas
    # Balance: suficiente para superar plateaus temporales sin entrenar de más
    # El run E4B anterior hubiera sido detenido en ~epoch 3 con esta config
    patience: 5

    # Umbral mínimo de mejora: 0.001 en eval_loss
    # Mejoras menores a 0.001 se consideran ruido estadístico
    # Evita continuar entrenando cuando el modelo ya convergió
    threshold: 0.001

  # ==============================================================================
  # Reanudación de Entrenamiento (si se interrumpe)
  # ==============================================================================

  # Cambiar a true si el entrenamiento se interrumpió (CTRL+C, timeout, etc.)
  resume_from_checkpoint: false
  resume_checkpoint_path: null  # null = detecta automáticamente el último checkpoint

  # ==============================================================================
  # Reproducibilidad y Monitorización
  # ==============================================================================

  # Semilla aleatoria para reproducibilidad
  # Afecta: inicialización de pesos LoRA, shuffling de datos, dropout
  seed: 21

  # TensorBoard habilitado para monitorización en tiempo real
  # Acceder en: http://localhost:6006 (port mapeado en docker-compose)
  # Permite ver train_loss vs eval_loss para detectar overfitting precozmente
  report_to: "tensorboard"

# ==============================================================================
# Configuración de Datos
# ==============================================================================
data:
  # Rutas del dataset dentro del contenedor Docker
  # Mapeadas desde Windows: C:\Users\aleja\Desktop\gemma3n\prepared_dataset_docker\
  # Dataset multimodal JSONL: cada línea = {"image": base64/path, "conversations": [...]}
  train_jsonl: "/workspace/project/prepared_dataset_docker/train_dataset.jsonl"
  eval_jsonl: "/workspace/project/prepared_dataset_docker/validation_dataset.jsonl"

# ==============================================================================
# Configuración PEFT (LoRA) - AJUSTADA PARA COMBATIR OVERFITTING
# ==============================================================================
peft:
  # LoRA Rank: 64
  # Por qué r=64 para E2B (MAYOR que r=32 del config E4B anterior):
  #   - E2B tiene menos parámetros base, por lo que necesita mayor capacidad
  #     de adaptación (rank) para aprender la tarea de detección de residuos
  #   - r=64 permite capturar relaciones de alto orden entre características
  #     visuales (colores, texturas de plástico) y semánticas (categorías)
  #   - Con RSLoRA activo, r=64 NO implica inestabilidad de entrenamiento
  #   - El costo en VRAM es manejable en RTX 5090: ~400MB adicionales vs r=32
  r: 64

  # LoRA Alpha: 64 (igual que el rank)
  # Convención: alpha/rank = 1.0 cuando se usa RSLoRA
  # RSLoRA ya normaliza la escala de actualización, alpha=rank es la base estándar
  # Con RSLoRA: escala efectiva = alpha / sqrt(rank) = 64/8 = 8.0
  lora_alpha: 64

  # LoRA Dropout: 0.05
  # DIFERENCIA CLAVE respecto al config E4B que usaba dropout=0.0:
  #   - El run E4B mostró overfitting severo (train=0.163, eval=2.556)
  #   - Dropout 5% introduce ruido regularizador en los adaptadores LoRA
  #   - Cada paso descarta aleatoriamente el 5% de las activaciones LoRA
  #   - Efecto: fuerza al modelo a aprender representaciones más robustas
  #   - 0.05 es conservador (no degrada convergencia, sí ayuda a generalizar)
  lora_dropout: 0.05

  # RSLoRA (Rank-Stabilized LoRA): activado para r=64
  # Justificación técnica:
  #   - LoRA estándar escala actualizaciones por alpha/rank = 64/64 = 1.0
  #   - A rank alto, los gradientes se vuelven inestables sin normalización
  #   - RSLoRA escala por alpha/sqrt(rank) = 64/sqrt(64) = 64/8 = 8.0
  #   - Esto estabiliza el entrenamiento y permite ranks altos sin divergencia
  #   - Recomendado por Unsloth cuando r >= 64
  use_rslora: true

  # Módulos a fine-tunear: TODOS los componentes principales
  # Para detección de residuos marinos necesitamos:
  #   - tune_vision_layers: procesa características visuales de imagen submarina
  #   - tune_language_layers: genera descripciones y categorías de residuos
  #   - tune_attention_modules: razonamiento espacial para bounding boxes
  #   - tune_mlp_modules: transformaciones no-lineales para clasificación
  tune_vision_layers: true      # Encoder visual (MobileNet-V5 en Gemma 3n)
  tune_language_layers: true    # Decoder Gemma (generación de texto/JSON)
  tune_attention_modules: true  # Multi-head attention (localización espacial)
  tune_mlp_modules: true        # Feed-forward networks (clasificación de tipos)

# ==============================================================================
# Configuración del Sistema
# ==============================================================================
system:
  # Deshabilitar Weights & Biases (usando TensorBoard en su lugar)
  # WandB requiere autenticación y acceso a internet; TensorBoard es local
  disable_wandb: true

logging:
  # Habilitar logging en consola además del archivo de log
  # Útil para monitorizar el progreso en la terminal de Docker
  console: true

# ==============================================================================
# Configuración de Exportación (Post-Entrenamiento)
# ==============================================================================
export:
  # Fusionar adaptadores LoRA con el modelo base al finalizar
  # Crea un modelo standalone listo para inferencia (sin dependencia de PEFT)
  # Necesario antes de convertir a formato mobile (TFLite/ONNX)
  merge_and_save: true
  merged_output_dir: null  # null = automático: {output_root}/runs/{run_name}/merged_model
  merge_dtype: "bf16"      # Mantener BFloat16 para precisión máxima post-merge

  # Exportación GGUF (para Llama.cpp en dispositivos edge)
  # Deshabilitado por defecto - habilitar manualmente si se necesita GGUF
  # Para Android se usa la pipeline: merge -> ONNX -> TFLite/LiteRT
  export_gguf: false
  gguf_output_dir: null
  gguf_quant: "Q4_K_M"   # Cuantización 4-bit K-means (si se habilita)
  gguf_source_dir: null   # null = auto-detecta el directorio merged

# ==============================================================================
# Optimizaciones Extra
# ==============================================================================
extras:
  # Collator de datos visual de Unsloth (optimizado para datos multimodales)
  # Gestiona padding de imágenes y texto de forma eficiente
  # REQUERIDO cuando el dataset mezcla imágenes de distintas resoluciones
  use_vision_data_collator: true

  # Implementación de atención: Flash Attention 2
  # RTX 5090 (Blackwell sm_120) tiene soporte nativo FA2 con mayor throughput
  # FA2 reduce memoria de atención de O(n²) a O(n) - crítico para seq=4096
  # Fallback automático a "eager" si FA2 no está disponible en el entorno
  attn_implementation: "flash_attention_2"

  # torch.compile: deshabilitado
  # Incompatible con QLoRA 4-bit (bitsandbytes + torch.compile tienen conflictos)
  # También incompatible con Unsloth's custom CUDA kernels en Blackwell
  torch_compile: false
  torch_compile_mode: "reduce-overhead"  # Ignorado (torch_compile=false)

# ==============================================================================
# Benchmarks de Rendimiento Esperados (RTX 5090 + E2B)
# ==============================================================================
# Velocidad de Entrenamiento:
#   - Pasos/segundo: ~1.0-1.3 (E2B es ~20-30% más rápido que E4B)
#   - Tiempo total estimado: 3-5 horas (vs 5-7h del E4B config)
#   - Pico de uso VRAM: ~24-27GB (margen de 5-8GB sobre los 32GB)
#   - Utilización GPU: 90-98%
#
# Calidad del Modelo (objetivo con dropout + RSLoRA):
#   - Eval loss esperado: <0.8 (vs 2.556 del run E4B con overfitting)
#   - Gap train/eval esperado: <2x (vs 15x del run anterior)
#   - Detección de plásticos: F1 ~0.65-0.72
#   - Detección de redes: F1 ~0.55-0.65
#
# Utilización de Recursos:
#   - GPU: RTX 5090 @ 90-98%
#   - CPU: ~30-50% de los 24 núcleos (dataloader workers)
#   - RAM: ~15-25GB de los 96GB (caching del dataset)
#   - I/O de disco: moderado (carga de imágenes desde JSONL)
# ==============================================================================

# ==============================================================================
# Instrucciones de Uso
# ==============================================================================
# 1. Construir imagen Docker con soporte RTX 5090:
#      docker build -f Dockerfile.rtx5090 -t gemma3n-rtx5090:latest .
#
# 2. Iniciar contenedor:
#      docker-compose -f docker-compose.rtx5090.yaml up -d
#
# 3. Verificar detección GPU (debe retornar (12, 0) para Blackwell):
#      docker exec -it gemma3n-training-rtx5090 python -c \
#        "import torch; print(torch.cuda.get_device_capability())"
#
# 4. Ejecutar entrenamiento E2B:
#      docker exec -it gemma3n-training-rtx5090 \
#        python /workspace/project/tools/train.py \
#        --config /workspace/project/tools/config.e2b.rtx5090.yaml
#
# 5. Monitorizar con TensorBoard (abrir en navegador):
#      http://localhost:6006
#      Vigilar: eval_loss debe bajar en paralelo con train_loss
#               Si eval_loss sube mientras train_loss baja -> overfitting
#
# 6. Evaluar resultados post-entrenamiento:
#      docker exec -it gemma3n-training-rtx5090 \
#        python /workspace/project/tools/evaluate_models.py \
#        --model-path /workspace/project/outputs/gemma3n/runs/gemma3n_e2b_rtx5090_mobile_v1
# ==============================================================================
