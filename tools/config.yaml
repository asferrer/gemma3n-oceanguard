training:
  run_name: "gemma3n_e2b_waste_peft_v1_mobile" # Nombre descriptivo para esta ejecución de entrenamiento.
  output_root: "./outputs/gemma3n"              # Carpeta principal donde se guardarán todos los artefactos de las ejecuciones.
  model_name: "unsloth/gemma-3n-E2B-it"         # El modelo base que vamos a ajustar. Usamos la versión optimizada de Unsloth.
  max_seq_len: 4096                             # [OPTIMIZADO] Longitud máxima de la secuencia (tokens). Aumentado a 8K para usar el contexto completo del modelo.

  # --- Precision & Memoria ---
  use_4bit: true                                # Activa la cuantización QLoRA (4-bit). Reduce drásticamente el uso de VRAM.
  bf16: true                                    # Usa BFloat16 para el entrenamiento. Más rápido y estable que FP16 si tu GPU lo soporta (RTX 30xx+).
  fp16: false                                   # Desactivado, ya que usamos bf16.
  gradient_checkpointing: true                  # Ahorra VRAM a costa de un pequeño extra de cómputo. Esencial para secuencias largas.

  # --- Optimizador y Planificador (Schedule) ---
  epochs: 50                                    # Número MÁXIMO de épocas (vueltas al dataset). Early Stopping (ver abajo) lo detendrá antes.
  optim: "paged_adamw_8bit"                     # Optimizador AdamW "paginado" de 8-bit. Eficiente en memoria, recomendado por Unsloth.
  weight_decay: 0.01                            # Parámetro de regularización L2 para evitar que los pesos crezcan demasiado y prevenir el overfitting.
  max_grad_norm: 1.0                            # "Gradient Clipping". Evita que los gradientes exploten (valores anómalos) y desestabilicen el entrenamiento.

  lr: 2.0e-5                                    # [OPTIMIZADO] Tasa de aprendizaje (Learning Rate). Reducida para un LoRA de alto rango (r=128) para un ajuste más estable.
  warmup_ratio: 0.03                            # Porcentaje de los pasos de entrenamiento (3%) donde el 'lr' subirá linealmente de 0 al 'lr' máximo (2.0e-5).
  lr_scheduler_type: "cosine"                   # Cómo disminuirá el 'lr' después del calentamiento. "cosine" es el estándar más efectivo.

  # --- Lotes (Batches) y Acumulación ---
  per_device_train_batch_size: 4                # [OPTIMIZADO] Cuántas muestras procesar a la vez por GPU en entrenamiento. Aumentado a 4 para tu 32GB VRAM.
  per_device_eval_batch_size: 2                 # Batch size para la evaluación (no necesita acumulación).
  gradient_accumulation_steps: 4                # [OPTIMIZADO] Acumula gradientes durante 4 pasos antes de actualizar los pesos. (Batch efectivo = 4 * 4 = 16).
  dataloader_num_workers: 8                     # Hilos de CPU para cargar datos en segundo plano. 8 es un buen valor para un sistema moderno.

  # --- Dataset ---
  dataset_num_proc: 1                           # Hilos para tokenizar el dataset. 1 es OBLIGATORIO en Windows para evitar errores de multiprocessing.
  dataset_batch_size: 1000                      # Tamaño del "chunk" (trozo) que `datasets.map` procesa a la vez.

  # --- Logs y Checkpoints ---
  logging_steps: 10                             # Escribir en el log (consola y archivo) cada 10 pasos.
  logging_first_step: false                     # No registrar en el primer paso (evita desorden).
  evaluation_strategy: "steps"                  # Evaluar el modelo cada X pasos (definido en 'eval_steps').

  eval_steps: 300                                # Evaluar cada 300 pasos (aprox. 1 epoch: 1107 muestras / (4*4 batch) ≈ 300 pasos).

  save_strategy: "steps"                        # Guardar un checkpoint cada X pasos (definido en 'save_steps').
  save_steps: 300                                # Guardar cada 300 pasos. Debe coincidir con 'eval_steps' para 'load_best_model_at_end'.

  save_total_limit: 3                           # Número máximo de checkpoints a guardar (guardará los 3 mejores).
  metric_for_best_model: "eval_loss"            # Métrica para decidir qué checkpoint es el "mejor". Menor 'eval_loss' es mejor.
  load_best_model_at_end: true                  # Al final del entrenamiento, cargar automáticamente el mejor checkpoint guardado.

  # --- Paro Temprano (Early Stopping) ---
  early_stopping:
    enabled: true                               # Activa el Paro Temprano.
    patience: 3                                 # Número de evaluaciones (3 * 350 pasos) que esperará sin mejora en 'eval_loss' antes de parar.
    threshold: 0.0                              # Umbral de mejora. 0.0 significa que cualquier mejora, por pequeña que sea, resetea la paciencia.

  # --- Resumir Entrenamiento ---
  resume_from_checkpoint: false                 # Si se debe continuar un entrenamiento fallido. Poner 'true' si se interrumpe.
  resume_checkpoint_path: null                  # Ruta al checkpoint específico para resumir (o 'null' para usar el último guardado).

  # --- Reproducibilidad y Sistema ---
  seed: 21                                      # Semilla aleatoria para que los resultados sean reproducibles.
  report_to: "none"                             # A dónde reportar métricas (ej. "wandb", "tensorboard"). "none" lo desactiva.

data:
  train_jsonl: "./prepared_dataset/train_dataset.jsonl" # Ruta a tu archivo de entrenamiento.
  eval_jsonl:  "./prepared_dataset/validation_dataset.jsonl" # Ruta a tu archivo de validación.

peft:
  r: 64                                        # Rango de LoRA (dimensión de las matrices). 128 es un valor alto para alta calidad.
  lora_alpha: 64                               # Alpha de LoRA.
  lora_dropout: 0.05                                 # Dropout en las capas LoRA. Ayuda a prevenir el sobreajuste con un 'r' tan alto.
  use_rslora: true                              # (Rank-Stabilized LoRA) Ajusta 'alpha' automáticamente. Recomendado por Unsloth.
  tune_vision_layers: true                       # Ajustar el modelo de visión. Mejora la adaptación en tareas multimodales.
  tune_language_layers: true                     # Ajustar el modelo de lenguaje base.
  tune_attention_modules: true                  # Ajustar las capas de atención. 
  tune_mlp_modules: true                        # Ajustar las capas MLP (feed-forward). Crucial para adaptar el modelo a nuevas tareas.

system:
  disable_wandb: true                           # Desactiva explícitamente el login a Weights & Biases.

logging:
  console: true                                 # Mostrar los logs en la consola (además del archivo .log).

export:
  merge_and_save: true                          # Al terminar, fusiona los adaptadores LoRA con el modelo base y guarda el modelo completo.
  merged_output_dir: null                       # Dónde guardar el modelo fusionado. 'null' usa la ruta por defecto (dentro de run_dir).
  merge_dtype: "bf16"                           # [OPTIMIZADO] Precisión para guardar el modelo fusionado. 'bf16' para no perder calidad del entrenamiento.
  export_gguf: false                            # No exportar a GGUF (formato para Llama.cpp).
  gguf_output_dir: null                         # Dónde guardar el GGUF.
  gguf_quant: "Q4_K_M"                          # Nivel de cuantización para GGUF (si se activa).
  gguf_source_dir: null                         # Carpeta desde la que crear el GGUF (null = auto-detectar).

extras:
  use_vision_data_collator: true
  attn_implementation: "flash_attention_2"      # Usará "flash_attention_2" si está disponible, o "eager" si no.
  torch_compile: false                          # Desactivado. Incompatible con el fine-tuning QLoRA (4-bit).
  torch_compile_mode: "reduce-overhead"         # Modo de compilación (ignorado ya que está 'false').