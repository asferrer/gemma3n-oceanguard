[project]
name = "oceanguard-ai"
version = "0.1.0"
description = "Marine debris detection using Gemma 3n VLM and RT-DETRv2, with Android mobile deployment"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "OceanGuard AI Team" },
]

dependencies = [
    "torch>=2.5.0",
    "torchvision>=0.20.0",
    "transformers>=4.47.0,<4.50.0",
    "datasets>=4.5.0,<5.0.0",
    "peft>=0.13.2",
    "accelerate>=1.2.0",
    "trl>=0.12.0",
    "bitsandbytes>=0.44.0",
    "pyyaml>=6.0",
    "pillow>=10.0.0",
    "tqdm>=4.66.0",
    "rich>=13.0.0",
    "numpy>=1.24.0",
    "huggingface-hub>=0.19.0",
    "safetensors>=0.4.0",
    "sentencepiece>=0.2.0",
    "packaging>=23.0",
]

[project.optional-dependencies]
training = [
    "flash-attn>=2.7.0",
    "tensorboard>=2.15.0",
    "matplotlib>=3.8.0",
    "seaborn>=0.12.0",
    "scikit-learn>=1.3.0",
    "scipy>=1.11.0",
    "opencv-python-headless>=4.8.0",
    "timm>=1.0.0",
    "omegaconf>=2.3.0",
    "gpustat>=1.1.0",
    "pandas>=2.0.0",
    "pyarrow>=15.0.0",
    "plotly>=5.17.0",
]
app = [
    "streamlit>=1.47.0",
    "streamlit-folium>=0.25.0",
    "folium>=0.20.0",
    "pydeck>=0.9.0",
    "piexif>=1.1.3",
    "opencv-python>=4.8.0",
]
conversion = [
    "ai-edge-torch",
    "ai-edge-litert",
    "mediapipe",
    "opencv-python>=4.8.0",
]
dev = [
    "pytest>=7.4.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "isort>=5.12.0",
]

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["tools", "app"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["tools"]
python_files = ["test_*.py"]
