# ==============================================================================
# Docker Compose Configuration para Gemma3N en RTX 2070
# ==============================================================================
# Optimizado para:
#   - RTX 2070 (8GB GDDR6, Turing sm_75)
#   - Windows 11 host
#   - 16-32GB RAM + CPU de consumo (8-12 cores tipico)
#
# Diferencias clave vs docker-compose.rtx5090.yaml:
#   - shm_size: 8gb (vs 64gb) - ajustado a 8GB VRAM disponible
#   - OMP_NUM_THREADS=4 (vs 16) - conservar CPU para el SO
#   - PYTORCH_CUDA_ALLOC_CONF con max_split_size_mb:128 - anti-fragmentacion
#   - Dataset montado como read-only (:ro) - no se necesita escritura
#   - Sin servicio gpu-monitor (ahorro de recursos)
#   - Sin puerto Jupyter (no instalado en esta imagen)
#   - Puerto TensorBoard alternativo: 6007 (para no colisionar con RTX 5090)
#
# Uso rapido:
#   docker-compose -f docker-compose.rtx2070.yaml up -d
#   docker-compose -f docker-compose.rtx2070.yaml --profile monitoring up -d
# ==============================================================================

services:

  # ==============================================================================
  # Servicio principal de entrenamiento - RTX 2070 Optimizado
  # ==============================================================================
  gemma3n-training:
    build:
      context: .
      dockerfile: Dockerfile.rtx2070  # Dockerfile especifico para Turing sm_75
    image: gemma3n-rtx2070:latest
    container_name: gemma3n-training-rtx2070

    # Configuracion GPU - RTX 2070 unica
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1          # GPU unica
              device_ids: ['0'] # Primera GPU del sistema (RTX 2070)
              capabilities: [gpu]

    # Variables de entorno - especificas para RTX 2070 y Turing
    environment:
      # Seleccion de GPU
      - NVIDIA_VISIBLE_DEVICES=0
      - CUDA_VISIBLE_DEVICES=0

      # Optimizacion de memoria CUDA
      # expandable_segments: reutiliza bloques liberados (critico con 8GB)
      # max_split_size_mb:128: reduce fragmentacion de memoria en VRAM limitada
      - PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True,max_split_size_mb:128

      # Configuracion Python
      - PYTHONUTF8=1
      - PYTHONUNBUFFERED=1

      # Arquitectura Turing (sm_75) - compilar kernels solo para RTX 2070
      - TORCH_CUDA_ARCH_LIST=7.5
      - FORCE_CUDA=1

      # Optimizacion CPU - 4 threads (conservador para sistemas de consumo)
      # Ajustar segun cores disponibles: cores_fisicos / 2 es un buen valor
      - OMP_NUM_THREADS=4
      - MKL_NUM_THREADS=4

      # Evita deadlocks en tokenizacion paralela con PEFT/Unsloth
      - TOKENIZERS_PARALLELISM=false

    # Volumenes - rutas de Windows
    volumes:
      # Directorio del proyecto (lectura/escritura para outputs)
      - .:/workspace/project

      # Dataset externo RT-DETRv2 en modo solo-lectura
      # :ro previene escrituras accidentales al dataset original
      - C:\Users\aleja\Desktop\RT-DETRv2-Densea\rtdetrv2_pytorch\dataset:/workspace/project/dataset:ro

    # Puertos de red
    ports:
      - "6006:6006"  # TensorBoard (acceso directo desde el contenedor de training)

    # Memoria compartida - ajustada para 8GB VRAM
    # 8gb es suficiente para DataLoader workers con batches pequenos
    # Reducir a 4gb si el sistema host tiene menos de 16GB RAM
    shm_size: '8gb'

    # Modo IPC - mejor soporte multi-proceso para DataLoader
    ipc: host

    # Mantener contenedor activo para uso interactivo
    stdin_open: true
    tty: true

    # Directorio de trabajo dentro del contenedor
    working_dir: /workspace/project

    # Ejecutar como usuario no-root (seguridad)
    user: unsloth

    # Comando default - shell interactivo
    command: /bin/bash

    # Politica de reinicio
    restart: unless-stopped

    # Configuracion de logs - conservador para disco
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ==============================================================================
  # Servicio TensorBoard (Opcional - perfil monitoring)
  # ==============================================================================
  # Activar con: docker-compose -f docker-compose.rtx2070.yaml --profile monitoring up -d
  # Acceder en: http://localhost:6007
  # ==============================================================================
  tensorboard:
    image: tensorflow/tensorflow:latest
    container_name: gemma3n-tensorboard-rtx2070

    volumes:
      - ./outputs:/workspace/outputs:ro  # Solo lectura - TensorBoard no necesita escribir

    ports:
      - "6007:6006"  # Puerto 6007 en host para no colisionar con el training container

    working_dir: /workspace

    command: tensorboard --logdir=/workspace/outputs --host=0.0.0.0 --port=6006 --reload_interval=30

    restart: unless-stopped
    profiles: ["monitoring"]  # Solo se inicia con --profile monitoring

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

# ==============================================================================
# Red interna del proyecto
# ==============================================================================
networks:
  default:
    name: gemma3n-rtx2070-network
    driver: bridge

# ==============================================================================
# Instrucciones de Uso
# ==============================================================================
#
# 1. Construir la imagen RTX 2070:
#      docker-compose -f docker-compose.rtx2070.yaml build
#
#    Con logs detallados (util para diagnosticar fallo de Flash Attention):
#      docker-compose -f docker-compose.rtx2070.yaml build --no-cache --progress=plain
#
# 2. Iniciar el contenedor de entrenamiento:
#      docker-compose -f docker-compose.rtx2070.yaml up -d
#
# 3. Verificar que la GPU RTX 2070 (sm_75) fue detectada correctamente:
#      docker exec -it gemma3n-training-rtx2070 python -c "\
#        import torch; \
#        print('GPU:', torch.cuda.get_device_name(0)); \
#        print('Capability:', torch.cuda.get_device_capability(0)); \
#        assert torch.cuda.get_device_capability(0)[0] == 7, 'No es Turing!'; \
#        print('VRAM:', round(torch.cuda.get_device_properties(0).total_memory / 1e9, 1), 'GB')"
#
# 4. Abrir shell interactivo:
#      docker exec -it gemma3n-training-rtx2070 bash
#
# 5. Ejecutar entrenamiento con config para RTX 2070:
#      docker exec -it gemma3n-training-rtx2070 \
#        python /workspace/project/tools/train.py \
#          --config /workspace/project/tools/config.e2b.rtx2070.yaml
#
#    O desde dentro del contenedor:
#      python tools/train.py --config tools/config.e2b.rtx2070.yaml
#
# 6. Iniciar TensorBoard para monitorear el entrenamiento:
#      docker-compose -f docker-compose.rtx2070.yaml --profile monitoring up -d tensorboard
#      # Abrir navegador en: http://localhost:6007
#
# 7. Ver logs del entrenamiento en tiempo real:
#      docker logs -f gemma3n-training-rtx2070
#
# 8. Monitorear VRAM durante entrenamiento (desde otra terminal):
#      docker exec gemma3n-training-rtx2070 watch -n 2 nvidia-smi
#
# 9. Detener todos los servicios:
#      docker-compose -f docker-compose.rtx2070.yaml down
#
# 10. Detener y limpiar imagenes (rebuild completo):
#       docker-compose -f docker-compose.rtx2070.yaml down --rmi all
#
# ==============================================================================
#
# Troubleshooting - Problemas Comunes
# ==============================================================================
#
# PROBLEMA: GPU no detectada en el contenedor
# CAUSA: nvidia-container-toolkit no instalado o driver desactualizado
# SOLUCION:
#   - Verificar en host: nvidia-smi (debe mostrar RTX 2070)
#   - Verificar toolkit: docker run --rm --gpus all nvidia/cuda:12.1.1-base-ubuntu22.04 nvidia-smi
#   - Instalar toolkit: https://docs.nvidia.com/datacenter/cloud-native/container-toolkit/install-guide.html
#   - En Windows: WSL2 debe tener acceso a GPU (Settings > Resources > GPU)
#
# PROBLEMA: Out of Memory (OOM) - CUDA out of memory durante entrenamiento
# CAUSA: 8GB VRAM insuficiente para la configuracion actual
# SOLUCIONES (aplicar en orden):
#   1. Reducir batch size a 1 en config.e2b.rtx2070.yaml:
#        per_device_train_batch_size: 1
#        gradient_accumulation_steps: 16  # Compensar con mas accumulation
#
#   2. Reducir longitud de secuencia:
#        max_seq_length: 1024  # Reducir desde 2048
#
#   3. Activar gradient checkpointing (ya deberia estar activo):
#        gradient_checkpointing: true
#
#   4. Reducir rango LoRA:
#        lora_r: 8   # Reducir desde 16
#        lora_alpha: 16
#
#   5. Forzar offload de optimizer a CPU (mas lento pero cabe):
#        optim: "adamw_8bit"  # Usar optimizer 8-bit
#
# PROBLEMA: Presion de memoria (sistema lento, swap activo)
# CAUSA: DataLoader workers consumen demasiada RAM del host
# SOLUCION:
#   - Reducir workers en config.e2b.rtx2070.yaml:
#       dataloader_num_workers: 2  # Reducir desde 4
#
#   - Si persiste, reducir shm_size en este archivo:
#       shm_size: '4gb'
#
# PROBLEMA: Entrenamiento muy lento (< 0.5 it/s)
# CAUSA: Flash Attention no disponible o CPU bottleneck
# DIAGNOSTICO:
#   - Verificar Flash Attention:
#       docker exec gemma3n-training-rtx2070 python -c "import flash_attn; print(flash_attn.__version__)"
#   - Verificar utilizacion GPU:
#       docker exec gemma3n-training-rtx2070 nvidia-smi
#       # La GPU debe estar al 90-100% durante forward/backward pass
#
# PROBLEMA: Healthcheck falla con "Compute capability incorrecta"
# CAUSA: Se esta usando una GPU diferente a RTX 2070 (o generacion diferente)
# SOLUCION:
#   - El healthcheck espera major=7 (Turing). Si tienes otra GPU:
#     * RTX 3070/3080: capability (8, 6) -> usar Dockerfile.rtx5090 con ARCH_LIST="8.6"
#     * RTX 4070/4080: capability (8, 9) -> usar Dockerfile.rtx5090 con ARCH_LIST="8.9"
#   - Para deshabilitar temporalmente el healthcheck:
#       HEALTHCHECK NONE  # Agregar al final del Dockerfile.rtx2070
#
# PROBLEMA: Contenedor se detiene solo durante entrenamiento
# CAUSA: OOM killer del kernel termina el proceso
# SOLUCION:
#   - Verificar logs: docker logs gemma3n-training-rtx2070 | tail -50
#   - Buscar "Killed" en los logs
#   - Aplicar soluciones de OOM descritas arriba
#   - El restart: unless-stopped reiniciara automaticamente el contenedor
#
# ==============================================================================
